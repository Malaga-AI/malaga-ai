<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Malaga-AI is a community dedicated to sharing the power and promise of Artificial Intelligence (AI), so that all people may benefit from this transformative technology."
    />
    <title>Malaga AI</title>
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // A stored choice wins; otherwise follow the OS, defaulting to dark when
      // the OS expresses no preference (or the query is unsupported).
      ;(function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('malaga-ai-theme')
          if (stored === 'light' || stored === 'dark') {
            theme = stored
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light'
          }
        } catch (error) {
          // Blocked storage: keep the dark default.
        }
        var root = document.documentElement
        root.classList.toggle('light', theme === 'light')
        root.classList.toggle('dark', theme === 'dark')
        root.style.colorScheme = theme

        // English is the default language; only an explicit stored choice
        // switches to Spanish. Set before first paint to avoid a flash.
        var language = 'en'
        try {
          var storedLanguage = localStorage.getItem('malaga-ai-language')
          if (storedLanguage === 'en' || storedLanguage === 'es') {
            language = storedLanguage
          }
        } catch (error) {
          // Blocked storage: keep the English default.
        }
        root.lang = language
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
